name: Security (OWASP)

# The OWASP dependency-check scan is a real gate (failBuildOnCVSS=7 in pom.xml), copied from
# message-inspector. The NVD download is the slow part, so it runs weekly and on demand
# rather than on every push. A failing run means a new HIGH/CRITICAL CVE has appeared in a
# dependency that is not suppressed (dependency-check-suppressions.xml).
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The ~600 MB NVD database lives here. Cache it so runs after the first are fast;
      # dependency-check updates it incrementally. The rolling key saves a fresh copy each
      # run and restores from the most recent one.
      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      - name: Run OWASP dependency-check
        run: ./mvnw -B dependency-check:check -Dnvd.api.key=${{ secrets.NVD_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
