# ==============================
# Server
# ==============================
# Loopback only: the API has no auth of its own (docs/known-gaps.md).
server.address=127.0.0.1
server.port=${SERVER_PORT:8085}
spring.application.name=messaging-triage-assistant

# ==============================
# Model (Ollama)
# ==============================
# One model for triage and chat. Both set thinking off per request.
triage.model=${TRIAGE_MODEL:qwen3:8b}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${triage.model}
# Never pull at startup: a missing model is a failed triage ("model unavailable"), not a
# 5 GB download behind the user's back.
spring.ai.ollama.init.pull-model-strategy=never
# No retries. A local model that failed once will fail again, and each retry would hold the
# request for another read timeout. Triage has its own one repair call instead.
spring.ai.retry.max-attempts=0
spring.ai.model.embedding=none
# A triage answer took 27-39 s with qwen3:8b fully in VRAM (README, "Honest limits"); a
# smaller GPU, or CPU only, takes minutes.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=5m
# Prompts and completions carry payloads; never log them.
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false

# ==============================
# Sources
# ==============================
# Defaults match the demo stacks (README, "Demo"). The credentials are the
# sibling repos' throwaway local ones; override them anywhere else.
triage.sources.connect-timeout=5s
triage.sources.read-timeout=30s

triage.sources.notification-platform.enabled=true
triage.sources.notification-platform.api-url=${NOTIFICATION_API_URL:http://localhost:8080}
triage.sources.notification-platform.worker-url=${NOTIFICATION_WORKER_URL:http://localhost:8081}
triage.sources.notification-platform.client-id=${NOTIFICATION_CLIENT_ID:notification-client}
triage.sources.notification-platform.client-secret=${NOTIFICATION_CLIENT_SECRET:dev-secret}

triage.sources.message-inspector.enabled=true
triage.sources.message-inspector.url=${MESSAGE_INSPECTOR_URL:http://localhost:8082}
# A USER account, not an ADMIN: the server refuses its write tools to a USER (ADR 0002).
triage.sources.message-inspector.username=${MESSAGE_INSPECTOR_USERNAME:jason}
triage.sources.message-inspector.password=${MESSAGE_INSPECTOR_PASSWORD:jason}
triage.sources.message-inspector.failure-queues=DLQ,ExpiryQueue
# The message property that holds why a message failed. Artemis records none of its own.
triage.sources.message-inspector.error-property=errorReason

# ==============================
# Limits
# ==============================
# Groups per source; past this the smallest are merged into one OTHER group.
triage.limits.max-groups=8
triage.limits.samples-per-group=3
# Characters per error and per payload excerpt.
triage.limits.max-text-chars=300
# Detail reads per triage on notification-platform (the list carries no error text).
triage.limits.max-detail-fetches=50
# Page size for each list and browse; both servers cap at 100.
triage.limits.page-size=100
# Total characters of errors and samples in one prompt; samples are dropped to fit.
triage.limits.prompt-budget-chars=12000

triage.chat.max-history-turns=10
triage.chat.max-tool-output-chars=8000
